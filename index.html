<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yuanyi</title>
<meta name="description" content="Yuanyi.ca" />
<style>
  :root {
    --bg-top: #fdf6f0;
    --bg-bottom: #f6e9f0;
    --logo-color: #3d2b3d;
    --accent: #d46a8f;
    --current-bg-top: #fff7e8;
    --current-bg-bottom: #dff3ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  body {
    background: linear-gradient(
      180deg,
      var(--current-bg-top) 0%,
      var(--current-bg-bottom) 100%
    );
    transition:
      background 3s ease-in-out,
      color 3s ease-in-out;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Logo ---------- */
  .logo {
    position: relative;
    z-index: 5;
    font-size: clamp(3rem, 12vw, 8rem);
    letter-spacing: 0.08em;
    color: var(--logo-color);
    text-shadow: 0 2px 18px rgba(212, 106, 143, 0.35);
    animation: breathe 6s ease-in-out infinite;
    transition: color 3s ease-in-out, text-shadow 3s ease-in-out;
    user-select: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  /* ---------- Flowers ---------- */
  .flower {
    position: absolute;
    transform-origin: center bottom;
    animation: sway 5s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  .flower svg { display: block; }

  /* Smoothly fade from one flower palette to the next. */
  .flower .petal,
  .flower .center {
    transition: fill 1.5s ease-in-out;
  }

  .flower.f1 { top: 12%;  left: 14%; width: 90px;  animation-duration: 5.5s; }
  .flower.f2 { top: 20%;  right: 12%; width: 70px;  animation-duration: 4.5s; animation-delay: .5s; }
  .flower.f3 { bottom: 14%; left: 10%; width: 100px; animation-duration: 6s;   animation-delay: 1s; }
  .flower.f4 { bottom: 10%; right: 16%; width: 80px;  animation-duration: 5s;   animation-delay: .3s; }
  .flower.f5 { top: 45%;  left: 4%;  width: 60px;  animation-duration: 4.8s; animation-delay: .8s; }
  .flower.f6 { top: 50%;  right: 5%; width: 65px;  animation-duration: 5.2s; animation-delay: 1.2s; }
  .flower.f7 { bottom: 30%; left: 24%; width: 45px; animation-duration: 4s; animation-delay: .6s; }
  .flower.f8 { top: 30%;  right: 26%; width: 50px; animation-duration: 4.3s; animation-delay: .2s; }

  /* ---------- Butterflies ---------- */
  .butterfly {
    position: absolute;
    width: 34px;
    height: 34px;
    will-change: transform;
    animation: flutter 3.2s ease-in-out infinite;
  }

  .butterfly .wings {
    width: 100%;
    height: 100%;
    animation: flap 0.35s ease-in-out infinite alternate;
    transform-origin: 50% 50%;
  }

  @keyframes flap {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0.55); }
  }

  .b1 { animation-name: path1; animation-duration: 14s; }
  .b2 { animation-name: path2; animation-duration: 18s; }
  .b3 { animation-name: path3; animation-duration: 16s; }

  @keyframes path1 {
    0%   { top: 20%; left: -5%;  transform: rotate(0deg); }
    20%  { top: 12%; left: 25%;  transform: rotate(8deg); }
    40%  { top: 30%; left: 50%;  transform: rotate(-6deg); }
    60%  { top: 15%; left: 75%;  transform: rotate(10deg); }
    80%  { top: 40%; left: 95%;  transform: rotate(-4deg); }
    100% { top: 20%; left: 110%; transform: rotate(0deg); }
  }

  @keyframes path2 {
    0%   { top: 70%; left: 105%; transform: rotate(180deg); }
    25%  { top: 60%; left: 75%;  transform: rotate(170deg); }
    50%  { top: 78%; left: 50%;  transform: rotate(190deg); }
    75%  { top: 58%; left: 25%;  transform: rotate(175deg); }
    100% { top: 70%; left: -10%; transform: rotate(180deg); }
  }

  @keyframes path3 {
    0%   { top: 85%; left: 10%;  transform: rotate(-20deg); }
    15%  { top: 55%; left: 30%;  transform: rotate(20deg); }
    35%  { top: 25%; left: 55%;  transform: rotate(-15deg); }
    55%  { top: 60%; left: 70%;  transform: rotate(25deg); }
    75%  { top: 35%; left: 85%;  transform: rotate(-10deg); }
    100% { top: 85%; left: 105%; transform: rotate(-20deg); }
  }

  @keyframes flutter {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .flower, .butterfly, .wings { animation: none !important; }

    .flower .petal,
    .flower .center {
      transition: none;
    }
  }
</style>
</head>

        <circle class="petal" cx="60" cy="68" r="16" fill="#f6b6a6"/>

        <circle class="petal" cx="30" cy="50" r="15" fill="#f2a6c6"/>

        <circle class="petal" cx="40" cy="68" r="15" fill="#f2a6c6"/>

        <circle class="center" cx="50" cy="52" r="13" fill="#fff1a8"/>
        <rect x="47" y="70" width="6" height="24" fill="#7fae6b"/>

        <circle class="petal" cx="30" cy="50" r="15" fill="#c9a6e8"/>

        <circle class="petal" cx="40" cy="68" r="15" fill="#c9a6e8"/>
        <circle class="petal" cx="60" cy="68" r="15" fill="#c9a6e8"/>

        <circle class="petal" cx="30" cy="50" r="15" fill="#f6b6a6"/>
        <circle class="petal" cx="70" cy="50" r="15" fill="#f6b6a6"/>
        <circle class="petal" cx="40" cy="68" r="15" fill="#f6b6a6"/>
        <circle class="petal" cx="60" cy="68" r="15" fill="#f6b6a6"/>

  <script>
    const flowerPalettes = [
      {
        petals: ['#f2a6c6', '#f7b2d0', '#e899bd', '#f5bfd5'],
        centers: ['#f7d774', '#fff1a8']
      },
      {
        petals: ['#c9a6e8', '#b995df', '#d5b5ef', '#ad8bd8'],
        centers: ['#ffe38f', '#fff0b5']
      },
      {
        petals: ['#79c7c5', '#6eb8b6', '#91d4d2', '#5fb0ad'],
        centers: ['#ffe082', '#fff1a8']
      },
      {
        petals: ['#8fb9e8', '#79a9df', '#a4c8ef', '#6f9fd5'],
        centers: ['#ffd978', '#fff0a8']
      },
      {
        petals: ['#f6b36d', '#f3a459', '#ffc585', '#e99648'],
        centers: ['#fff0a8', '#ffd166']
      },
      {
        petals: ['#ee8d82', '#f29f96', '#e77b70', '#f5ada5'],
        centers: ['#ffe08a', '#fff1b2']
      },
      {
        petals: ['#9fd3a8', '#8bc797', '#b3dfba', '#77ba84'],
        centers: ['#ffe082', '#fff4bd']
      }
    ];

    const backgroundPalettes = [
      {
        top: '#fff7e8',
        bottom: '#dff3ff',
        logo: '#3d2b3d',
        shadow: 'rgba(212, 106, 143, 0.35)'
      },
      {
        top: '#ffe8c7',
        bottom: '#f8d8df',
        logo: '#493246',
        shadow: 'rgba(211, 115, 139, 0.38)'
      },
      {
        top: '#ffd6b0',
        bottom: '#d7c5e8',
        logo: '#43304d',
        shadow: 'rgba(129, 97, 163, 0.4)'
      },
      {
        top: '#b8c9e8',
        bottom: '#8b83b8',
        logo: '#302b4f',
        shadow: 'rgba(70, 60, 120, 0.42)'
      },
      {
        top: '#7785ad',
        bottom: '#4d4b78',
        logo: '#f7ecff',
        shadow: 'rgba(245, 222, 255, 0.42)'
      },
      {
        top: '#414d72',
        bottom: '#282743',
        logo: '#fff1fa',
        shadow: 'rgba(255, 217, 239, 0.48)'
      },
      {
        top: '#1d2946',
        bottom: '#111426',
        logo: '#fff4fb',
        shadow: 'rgba(255, 224, 243, 0.52)'
      }
    ];

    const flowers = document.querySelectorAll('.flower');
    const logo = document.querySelector('.logo');
    const root = document.documentElement;

    let paletteIndex = 0;

    function applyScenePalette() {
      const flowerPalette = flowerPalettes[paletteIndex];
      const backgroundPalette = backgroundPalettes[paletteIndex];

      flowers.forEach((flower, flowerIndex) => {
        const petalColor =
          flowerPalette.petals[flowerIndex % flowerPalette.petals.length];
        const centerColor =
          flowerPalette.centers[flowerIndex % flowerPalette.centers.length];

        flower.querySelectorAll('.petal').forEach((petal) => {
          petal.setAttribute('fill', petalColor);
        });

        flower.querySelectorAll('.center').forEach((center) => {
          center.setAttribute('fill', centerColor);
        });
      });

      root.style.setProperty('--current-bg-top', backgroundPalette.top);
      root.style.setProperty('--current-bg-bottom', backgroundPalette.bottom);
      logo.style.color = backgroundPalette.logo;
      logo.style.textShadow =
        `0 2px 18px ${backgroundPalette.shadow}`;

      paletteIndex = (paletteIndex + 1) % flowerPalettes.length;
    }

    // Start with the first palette immediately.
    applyScenePalette();

    // Change flower colors and move the background gradually
    // from daylight to nighttime every 5 seconds.
    setInterval(applyScenePalette, 5000);
  </script>
</body>
