<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yuanyi</title>
<meta name="description" content="Yuanyi.ca" />
<style>
  :root {
    --bg-top: #fdf6f0;
    --bg-bottom: #f6e9f0;
    --logo-color: #3d2b3d;
    --accent: #d46a8f;
    --current-bg-top: #fff7e8;
    --current-bg-bottom: #dff3ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  body {
    background: linear-gradient(
      180deg,
      var(--current-bg-top) 0%,
      var(--current-bg-bottom) 100%
    );
    transition: background 3s ease-in-out;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Logo ---------- */
  .logo {
    position: relative;
    z-index: 5;
    font-size: clamp(3rem, 12vw, 8rem);
    letter-spacing: 0.08em;
    color: var(--logo-color);
    text-shadow: 0 2px 18px rgba(212, 106, 143, 0.35);
    animation: breathe 6s ease-in-out infinite;
    transition: color 3s ease-in-out, text-shadow 3s ease-in-out;
    user-select: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  /* ---------- Flowers ---------- */
  .flower {
    position: absolute;
    transform-origin: center bottom;
    animation: sway 5s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  .flower svg { display: block; }

  /* Smoothly fade from one flower palette to the next. */
  .flower .petal,
  .flower .center {
    transition: fill 1.5s ease-in-out;
  }

  .flower.f1 { top: 12%;  left: 14%; width: 90px;  animation-duration: 5.5s; }
  .flower.f2 { top: 20%;  right: 12%; width: 70px;  animation-duration: 4.5s; animation-delay: .5s; }
  .flower.f3 { bottom: 14%; left: 10%; width: 100px; animation-duration: 6s;   animation-delay: 1s; }
  .flower.f4 { bottom: 10%; right: 16%; width: 80px;  animation-duration: 5s;   animation-delay: .3s; }
  .flower.f5 { top: 45%;  left: 4%;  width: 60px;  animation-duration: 4.8s; animation-delay: .8s; }
  .flower.f6 { top: 50%;  right: 5%; width: 65px;  animation-duration: 5.2s; animation-delay: 1.2s; }
  .flower.f7 { bottom: 30%; left: 24%; width: 45px; animation-duration: 4s; animation-delay: .6s; }
  .flower.f8 { top: 30%;  right: 26%; width: 50px; animation-duration: 4.3s; animation-delay: .2s; }

  /* ---------- Butterflies ---------- */
  .butterfly {
    position: absolute;
    width: 34px;
    height: 34px;
    will-change: transform;
    animation: flutter 3.2s ease-in-out infinite;
  }

  .butterfly .wings {
    width: 100%;
    height: 100%;
    animation: flap 0.35s ease-in-out infinite alternate;
    transform-origin: 50% 50%;
  }

  @keyframes flap {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0.55); }
  }

  .b1 { animation-name: path1; animation-duration: 14s; }
  .b2 { animation-name: path2; animation-duration: 18s; }
  .b3 { animation-name: path3; animation-duration: 16s; }

  @keyframes path1 {
    0%   { top: 20%; left: -5%;  transform: rotate(0deg); }
    20%  { top: 12%; left: 25%;  transform: rotate(8deg); }
    40%  { top: 30%; left: 50%;  transform: rotate(-6deg); }
    60%  { top: 15%; left: 75%;  transform: rotate(10deg); }
    80%  { top: 40%; left: 95%;  transform: rotate(-4deg); }
    100% { top: 20%; left: 110%; transform: rotate(0deg); }
  }

  @keyframes path2 {
    0%   { top: 70%; left: 105%; transform: rotate(180deg); }
    25%  { top: 60%; left: 75%;  transform: rotate(170deg); }
    50%  { top: 78%; left: 50%;  transform: rotate(190deg); }
    75%  { top: 58%; left: 25%;  transform: rotate(175deg); }
    100% { top: 70%; left: -10%; transform: rotate(180deg); }
  }

  @keyframes path3 {
    0%   { top: 85%; left: 10%;  transform: rotate(-20deg); }
    15%  { top: 55%; left: 30%;  transform: rotate(20deg); }
    35%  { top: 25%; left: 55%;  transform: rotate(-15deg); }
    55%  { top: 60%; left: 70%;  transform: rotate(25deg); }
    75%  { top: 35%; left: 85%;  transform: rotate(-10deg); }
    100% { top: 85%; left: 105%; transform: rotate(-20deg); }
  }

  @keyframes flutter {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .flower, .butterfly, .wings { animation: none !important; }

    .flower .petal,
    .flower .center {
      transition: none;
    }
  }

  /* ---------- Daytime sun ---------- */
  .sun {
    position: absolute;
    top: 5%;
    right: -90px;
    width: 68px;
    height: 68px;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 18px rgba(255, 211, 91, 0.75));
  }

  .sun.visible {
    opacity: 1;
    animation: sunTravel 10s linear forwards;
  }

  @keyframes sunTravel {
    0% {
      right: -90px;
      top: 8%;
      transform: rotate(0deg) scale(0.9);
    }
    50% {
      right: calc(50% - 34px);
      top: 3%;
      transform: rotate(180deg) scale(1);
    }
    100% {
      right: calc(100% + 20px);
      top: 8%;
      transform: rotate(360deg) scale(0.9);
    }
  }

  /* ---------- Cartoon girl ---------- */
  .girl {
    position: absolute;
    bottom: 3%;
    left: -180px;
    width: 150px;
    height: 230px;
    z-index: 8;
    opacity: 0;
    pointer-events: none;
    will-change: transform, left, right, opacity;
  }

  .girl.from-right {
    left: auto;
    right: -180px;
  }

  .girl.active.from-left {
    animation: girlFromLeft 10s ease-in-out forwards;
  }

  .girl.active.from-right {
    animation: girlFromRight 10s ease-in-out forwards;
  }

  .girl .wave-arm {
    transform-box: fill-box;
    transform-origin: 50% 10%;
  }

  .girl.active .wave-arm {
    animation: waveArm 0.55s ease-in-out 5 alternate;
    animation-delay: 3.1s;
  }

  .girl .smile {
    opacity: 0;
  }

  .girl.active .smile {
    animation: smileOn 2.7s ease forwards;
    animation-delay: 3s;
  }

  @keyframes girlFromLeft {
    0% {
      left: -180px;
      opacity: 0;
      transform: translateY(8px) rotate(-2deg);
    }
    8% {
      opacity: 1;
    }
    32% {
      left: calc(50% - 75px);
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }
    68% {
      left: calc(50% - 75px);
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }
    100% {
      left: calc(100% + 40px);
      opacity: 0;
      transform: translateY(10px) rotate(3deg);
    }
  }

  @keyframes girlFromRight {
    0% {
      right: -180px;
      opacity: 0;
      transform: translateY(8px) rotate(2deg);
    }
    8% {
      opacity: 1;
    }
    32% {
      right: calc(50% - 75px);
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }
    68% {
      right: calc(50% - 75px);
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }
    100% {
      right: calc(100% + 40px);
      opacity: 0;
      transform: translateY(10px) rotate(-3deg);
    }
  }

  @keyframes waveArm {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-34deg); }
  }

  @keyframes smileOn {
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }

</style>
</head>

  <script>
    const flowerColors = [
      '#f2a6c6', // pink
      '#c9a6e8', // purple
      '#79c7c5', // teal
      '#8fb9e8', // blue
      '#f6b36d', // orange
      '#ee8d82', // coral
      '#9fd3a8', // green
      '#f3df72'  // yellow
    ];

    const centerColors = [
      '#f7d774',
      '#fff1a8',
      '#ffd166',
      '#ffe082'
    ];

    const flowers = document.querySelectorAll('.flower');
    let colorOffset = 0;

    function updateFlowerColors() {
      flowers.forEach((flower, flowerIndex) => {
        const petalColor =
          flowerColors[(flowerIndex + colorOffset) % flowerColors.length];

        const centerColor =
          centerColors[(flowerIndex + colorOffset) % centerColors.length];

        flower.querySelectorAll('.petal').forEach((petal) => {
          petal.setAttribute('fill', petalColor);
        });

        flower.querySelectorAll('.center').forEach((center) => {
          center.setAttribute('fill', centerColor);
        });
      });

      colorOffset = (colorOffset + 1) % flowerColors.length;
    }

    // Apply eight different flower colors immediately.
    updateFlowerColors();

    // Rotate every flower to the next color every 10 seconds.
    setInterval(updateFlowerColors, 10000);

    const skyColors = [
      {
        top: '#fff7e8',
        bottom: '#dff3ff',
        daylight: true
      },
      {
        top: '#ffd8a8',
        bottom: '#f7bfd4',
        daylight: true
      },
      {
        top: '#4a587f',
        bottom: '#2e3558',
        daylight: false
      },
      {
        top: '#16213d',
        bottom: '#090d18',
        daylight: false
      },
      {
        top: '#8f91bd',
        bottom: '#665f91',
        daylight: false
      },
      {
        top: '#ffd8c2',
        bottom: '#d8e7ff',
        daylight: true
      }
    ];

    const sun = document.querySelector('.sun');
    let skyIndex = 0;

    function restartSunAnimation() {
      sun.classList.remove('visible');
      void sun.offsetWidth;
      sun.classList.add('visible');
    }

    function updateSkyBackground() {
      const sky = skyColors[skyIndex];

      document.documentElement.style.setProperty(
        '--current-bg-top',
        sky.top
      );

      document.documentElement.style.setProperty(
        '--current-bg-bottom',
        sky.bottom
      );

      if (sky.daylight) {
        restartSunAnimation();
      } else {
        sun.classList.remove('visible');
      }

      skyIndex = (skyIndex + 1) % skyColors.length;
    }

    updateSkyBackground();
    setInterval(updateSkyBackground, 10000);

    const girl = document.querySelector('.girl');
    let girlFromLeft = true;

    function playGirlAnimation() {
      girl.classList.remove('active', 'from-left', 'from-right');
      void girl.offsetWidth;

      girl.classList.add(girlFromLeft ? 'from-left' : 'from-right');
      girl.classList.add('active');

      girlFromLeft = !girlFromLeft;
    }

    // First appearance after 40 seconds, then every 40 seconds.
    setInterval(playGirlAnimation, 40000);
  </script>
